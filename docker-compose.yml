services:
  postgres:
    image: postgres:16-alpine
    container_name: fb_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fbcrm
      POSTGRES_PASSWORD: fbcrm_secret_password
      POSTGRES_DB: fb_multipage_crm
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: